[package]
name = "maka-gitoxide-broker"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.98"
publish = false

[[bin]]
name = "maka-gitoxide-broker"
path = "src/main.rs"

[dependencies]
gix = { version = "=0.86.0", default-features = false, features = ["sha1", "sha256", "tree-editor"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
