name: macOS recovery

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: macos-recovery-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  macos_recovery:
    name: macos_recovery
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build managed workspace recovery artifacts
        run: |
          npm run build -w @maka/core
          npm run build -w @maka/storage

      - name: Verify managed workspace crash recovery
        run: node scripts/run-recovery-test-inventory.mjs managed-workspace
