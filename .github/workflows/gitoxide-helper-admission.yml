name: Gitoxide helper admission

on:
  pull_request:
    paths:
      - '.github/workflows/gitoxide-helper-admission.yml'
      - 'native/gitoxide-helper/**'
      - 'packages/runtime-host/src/server/gitoxide-helper-*.ts'
      - 'packages/runtime-host/src/__tests__/gitoxide-helper-*.test.ts'
      - 'packages/runtime-host/src/server/gitoxide-repository-admission-authority-internal.ts'
      - 'packages/runtime-host/src/server/gitoxide-mutation-candidate-receipt-authority-internal.ts'
      - 'packages/runtime-host/src/server/gitoxide-managed-write-edit-owner-internal.ts'
      - 'packages/runtime-host/src/server/gitoxide-managed-session-owner-internal.ts'
      - 'packages/runtime-host/src/server/gitoxide-managed-gc-owner-internal.ts'
      - 'packages/runtime-host/src/server/packaged-gitoxide-helper-internal.ts'
      - 'packages/runtime-host/src/server/hosted-execution-tool-profile.ts'
      - 'packages/runtime-host/src/server/execution-composition.ts'
      - 'packages/runtime-host/src/server/root-turn-coordinator.ts'
      - 'packages/runtime-host/src/__tests__/gitoxide-repository-admission-authority-internal.test.ts'
      - 'packages/runtime-host/src/__tests__/gitoxide-managed-write-edit-owner-internal.test.ts'
      - 'packages/runtime-host/src/__tests__/gitoxide-managed-session-owner-internal.test.ts'
      - 'packages/runtime-host/src/__tests__/gitoxide-managed-gc-owner-internal.test.ts'
      - 'packages/runtime-host/src/__tests__/gitoxide-managed-continuation-crash.test.ts'
      - 'packages/runtime-host/src/__tests__/managed-coding-v2-crash.test.ts'
      - 'experiments/windows-sandbox/launcher/**'
      - 'packages/runtime-host/src/server/current-process-managed-toolchain-internal.ts'
      - 'packages/runtime-host/src/server/managed-command-*.ts'
      - 'packages/runtime-host/src/server/managed-node-test-*.ts'
      - 'packages/runtime-host/src/__tests__/fixtures/execution-host*.ts'
      - 'packages/runtime-host/src/__tests__/packaged-gitoxide-helper.test.ts'
      - 'packages/runtime-host/src/__tests__/hosted-execution-tool-profile.test.ts'
      - 'scripts/prepare-gitoxide-helper*'
      - 'packages/runtime-host/src/__tests__/fixtures/gitoxide-candidate-receipt-crash-child.ts'
      - 'packages/runtime-host/src/__tests__/fixtures/gitoxide-managed-write-edit-owner-crash-child.ts'
      - 'packages/runtime-host/src/__tests__/fixtures/gitoxide-managed-session-owner-crash-child.ts'
      - 'packages/runtime-host/src/__tests__/fixtures/gitoxide-managed-candidate-gc-crash-child.ts'
      - 'packages/storage/src/execution-stores-workspace-authority-internal.ts'
      - 'packages/storage/src/workspace-version-authority-internal.ts'
      - 'packages/storage/src/sqlite-runtime-store.ts'
      - 'packages/runtime/package.json'
      - 'docs/architecture/gitoxide-*.md'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/gitoxide-helper-admission.yml'
      - 'native/gitoxide-helper/**'
      - 'packages/runtime-host/src/server/gitoxide-helper-*.ts'
      - 'packages/runtime-host/src/__tests__/gitoxide-helper-*.test.ts'
      - 'packages/runtime-host/src/server/gitoxide-repository-admission-authority-internal.ts'
      - 'packages/runtime-host/src/server/gitoxide-mutation-candidate-receipt-authority-internal.ts'
      - 'packages/runtime-host/src/server/gitoxide-managed-write-edit-owner-internal.ts'
      - 'packages/runtime-host/src/server/gitoxide-managed-session-owner-internal.ts'
      - 'packages/runtime-host/src/server/gitoxide-managed-gc-owner-internal.ts'
      - 'packages/runtime-host/src/server/packaged-gitoxide-helper-internal.ts'
      - 'packages/runtime-host/src/server/hosted-execution-tool-profile.ts'
      - 'packages/runtime-host/src/server/execution-composition.ts'
      - 'packages/runtime-host/src/server/root-turn-coordinator.ts'
      - 'packages/runtime-host/src/__tests__/gitoxide-repository-admission-authority-internal.test.ts'
      - 'packages/runtime-host/src/__tests__/gitoxide-managed-write-edit-owner-internal.test.ts'
      - 'packages/runtime-host/src/__tests__/gitoxide-managed-session-owner-internal.test.ts'
      - 'packages/runtime-host/src/__tests__/gitoxide-managed-gc-owner-internal.test.ts'
      - 'packages/runtime-host/src/__tests__/gitoxide-managed-continuation-crash.test.ts'
      - 'packages/runtime-host/src/__tests__/managed-coding-v2-crash.test.ts'
      - 'experiments/windows-sandbox/launcher/**'
      - 'packages/runtime-host/src/server/current-process-managed-toolchain-internal.ts'
      - 'packages/runtime-host/src/server/managed-command-*.ts'
      - 'packages/runtime-host/src/server/managed-node-test-*.ts'
      - 'packages/runtime-host/src/__tests__/fixtures/execution-host*.ts'
      - 'packages/runtime-host/src/__tests__/packaged-gitoxide-helper.test.ts'
      - 'packages/runtime-host/src/__tests__/hosted-execution-tool-profile.test.ts'
      - 'scripts/prepare-gitoxide-helper*'
      - 'packages/runtime-host/src/__tests__/fixtures/gitoxide-candidate-receipt-crash-child.ts'
      - 'packages/runtime-host/src/__tests__/fixtures/gitoxide-managed-write-edit-owner-crash-child.ts'
      - 'packages/runtime-host/src/__tests__/fixtures/gitoxide-managed-session-owner-crash-child.ts'
      - 'packages/runtime-host/src/__tests__/fixtures/gitoxide-managed-candidate-gc-crash-child.ts'
      - 'packages/storage/src/execution-stores-workspace-authority-internal.ts'
      - 'packages/storage/src/workspace-version-authority-internal.ts'
      - 'packages/storage/src/sqlite-runtime-store.ts'
      - 'packages/runtime/package.json'
      - 'docs/architecture/gitoxide-*.md'

permissions:
  contents: read

concurrency:
  group: gitoxide-helper-admission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm
      - name: Install the Linux sandbox runtime
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Enable bubblewrap user namespaces
        if: runner.os == 'Linux'
        run: |
          if [[ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          if [[ -e /proc/sys/kernel/unprivileged_userns_clone ]]; then
            sudo sysctl -w kernel.unprivileged_userns_clone=1
          fi
      - name: Check Rust formatting
        working-directory: native/gitoxide-helper
        run: cargo fmt --check
      - name: Test the short-lived Gitoxide helper
        working-directory: native/gitoxide-helper
        run: cargo test --locked
      - name: Build the Windows sandbox launcher
        if: runner.os == 'Windows'
        working-directory: experiments/windows-sandbox/launcher
        run: cargo build --locked
      - name: Install JavaScript dependencies without packaging hooks
        run: npm ci --ignore-scripts
      - name: Install the exact Electron runtime used by the packaged Host gate
        run: node scripts/install-electron-with-retry.mjs
      - name: Build the helper invocation owner
        run: >-
          npm --workspace @maka/core run build &&
          npm --workspace @maka/storage run build &&
          npm --workspace @maka/runtime run build &&
          npm --workspace @maka/runtime-host run build
      - name: Test the real helper invocation contract
        env:
          MAKA_GITOXIDE_HELPER_PATH: ${{ github.workspace }}/native/gitoxide-helper/target/debug/maka-gitoxide-helper${{ runner.os == 'Windows' && '.exe' || '' }}
        run: >-
          node --test
          packages/runtime-host/dist/__tests__/gitoxide-helper-artifact-authority-internal.test.js
          packages/runtime-host/dist/__tests__/gitoxide-helper-invocation-internal.test.js
          packages/runtime-host/dist/__tests__/gitoxide-repository-admission-authority-internal.test.js
          packages/runtime-host/dist/__tests__/gitoxide-managed-write-edit-owner-internal.test.js
          packages/runtime-host/dist/__tests__/gitoxide-managed-session-owner-internal.test.js
          packages/runtime-host/dist/__tests__/gitoxide-managed-gc-owner-internal.test.js
          packages/runtime-host/dist/__tests__/packaged-gitoxide-helper.test.js
          packages/runtime-host/dist/__tests__/hosted-execution-tool-profile.test.js
      - name: Test the Git and non-Git managed continuation crash matrix
        env:
          MAKA_GITOXIDE_HELPER_PATH: ${{ github.workspace }}/native/gitoxide-helper/target/debug/maka-gitoxide-helper${{ runner.os == 'Windows' && '.exe' || '' }}
        run: node --test packages/runtime-host/dist/__tests__/gitoxide-managed-continuation-crash.test.js
      - name: Test packaged managed-coding-v2 Host crash convergence
        env:
          MAKA_GITOXIDE_HELPER_PATH: ${{ github.workspace }}/native/gitoxide-helper/target/debug/maka-gitoxide-helper${{ runner.os == 'Windows' && '.exe' || '' }}
          MAKA_WINDOWS_SANDBOX_PATH: ${{ github.workspace }}/experiments/windows-sandbox/launcher/target/debug/maka-windows-sandbox.exe
        run: node --test packages/runtime-host/dist/__tests__/managed-coding-v2-crash.test.js
      - name: Test packaged helper preparation
        run: node --test scripts/prepare-gitoxide-helper.test.mjs
