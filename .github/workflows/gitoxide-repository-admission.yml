name: Gitoxide repository admission

on:
  pull_request:
    paths:
      - '.github/workflows/gitoxide-repository-admission.yml'
      - 'native/gitoxide-broker/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/gitoxide-repository-admission.yml'
      - 'native/gitoxide-broker/**'

permissions:
  contents: read

concurrency:
  group: gitoxide-admission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Rust formatting
        working-directory: native/gitoxide-broker
        run: cargo fmt --check
      - name: Test the Gitoxide broker
        working-directory: native/gitoxide-broker
        run: cargo test --locked
